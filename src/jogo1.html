<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combine os Valores - Jogo 1</title>
    <link rel="stylesheet" href="jogo1.css">
    
</head>
<body>

    <div class="container">
        <header class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="logo-img">
                <h1>Jogos dos <span>Valores</span></h1>
            </div>
            <nav><a href="inicio.html">Início</a></nav>
        </header>

        <main class="main-content">
            <div class="game-box">
                <h2 id="nivel-titulo">Nível 1</h2>
                <p class="subtitle">Selecione a palavra e depois a imagem correta!</p>
                
                <div class="match-container">
                    <div id="coluna-palavras" class="column"></div>
                    <div id="coluna-imagens" class="column"></div>
                </div>

                <button id="btn-proximo" class="btn-play-action" style="display: none;" onclick="proximoNivel()">PRÓXIMO NÍVEL</button>
            </div>
        </main>

        <footer class="footer-controls">
            <button class="help-btn">🤟 Ajuda</button>
            <button class="help-btn blue">▶ Tutorial LIBRAS</button>
        </footer>
    </div>

    <script src="jogo1.js"></script>
</body>
</html>
