<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos dos Valores - Combine a Palavra</title>
    <link rel="stylesheet" href="jogo1.css">
</head>
<body>

    <div class="container">
        <header class="header-container">
             <div class="logo-area">
                <img src="logo.png" alt="Logo do site" class="logo-img">
                <h1>Jogos dos <span>Valores</span></h1>
            </div>
            <nav>
                <a href="inicio.html">Início</a> | 
                 <a href="instrucoes.html">Instruções</a> | 
                <a href="contato.html">Contato</a>
            </nav>
        </header>

        <main class="main-content">
            <section class="game-box">
                <h2>Combine a Palavra</h2>
                <p class="subtitle">Relacione as palavras as imagens!</p>
                
                <div class="match-container">
                    <div class="column">
                        <button class="word-btn orange" data-value="respeito">Respeito</button>
                        <button class="word-btn orange" data-value="solidariedade">Solidariedade</button>
                        <button class="word-btn orange" data-value="amizade">Amizade</button>
                    </div>

                    <div class="column">
                        <div class="symbol-card" data-match="respeito"><img src="respeito.png" alt="Respeito"></div>
                        <div class="symbol-card" data-match="solidariedade"><img src="solidariedade.png" alt="Solidariedade"></div>
                        <div class="symbol-card" data-match="amizade"><img src="amizade.png" alt="Amizade"></div>
                    </div>
                </div>

                <button id="btn-play-game" class="btn-play-action">Jogar</button>
            </section>
        </main>

        <footer class="footer-controls">
            <button class="help-btn">🤟 Como Jogar?</button>
            <button class="help-btn blue">▶ Tutorial em LIBRAS</button>
        </footer>
    </div>

    <script src="jogo1.js"></script>

 <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
