<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos das Combinações - Valores</title>
    <link rel="stylesheet" href="jogo1.css">
</head>
<body>
    <div class="container">
        <header class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="logo-img">
                <h1>Jogos dos <span>Valores</span></h1>
            </div>
            <nav><a href="inicio.html">Início</a></nav>
        </header>

        <main class="game-box" id="game-box">
            <h2 id="nivel-titulo">Início</h2>
            <p id="instrucao" class="subtitle">Bem-vindo! Clique em Jogar para começar.</p>

            <!-- ETAPA 1: COMBINAÇÃO -->
            <div id="match-area" class="match-container" style="display: none;">
                <div id="coluna-palavras"></div>
                <div id="coluna-imagens"></div>
            </div>

            <!-- ETAPA 2: ESCRITA -->
            <div id="escrita-container" style="display: none;">
                <div id="imagem-pergunta"></div>
                <input type="text" id="input-palavra" placeholder="ESCREVA AQUI" autocomplete="off">
            </div>

            <button id="btn-acao" class="btn-play-action" onclick="gerenciarBotaoPrincipal()">JOGAR</button>
        </main>

        <footer class="footer-controls">
            <button class="help-btn">🤟 Como Jogar?</button>
        </footer>
    </div>

    <!-- MODAL DE FEEDBACK -->
    <div id="modal-feedback">
        <div class="modal-content">
            <h2 id="modal-titulo">Atenção</h2>
            <p id="modal-mensagem"></p>
            <button onclick="fecharModal()" class="modal-btn-ok">OK</button>
        </div>
    </div>

    <script src="jogo1.js"></script>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
