<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Valores</title>
    <link rel="stylesheet" href="jogo2.css">
</head>
<body>

    <div class="container">
        <header class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="logo-img">
                <h1>Jogos dos <span>Valores</span></h1>
            </div>
            <nav><a href="inicio.html">Início</a></nav>
        </header>

        <main class="main-content">
            <div class="game-box">
                <h2 id="nivel-titulo">Nível 1</h2>
                <p class="subtitle">Encontre os pares de valores iguais!</p>
                
                <div id="memory-grid" class="memory-grid">
                    </div>

                <button id="btn-jogar" class="btn-play-action" onclick="iniciarJogo()">JOGAR</button>
            </div>
        </main>

        <footer class="footer-controls">
            <button class="help-btn">🤟 Como Jogar?</button>
            <button class="help-btn blue">▶ Tutorial em LIBRAS</button>
        </footer>
    </div>

    <script src="jogo2.js"></script>
</body>
</html>
