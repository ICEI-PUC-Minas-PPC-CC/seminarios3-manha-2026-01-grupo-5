<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Valores</title>
    <link rel="stylesheet" href="jogo2.css">
</head>
<body>

    <div class="container">
        <header class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Logo" class="logo-img">
                <h1>Jogos dos <span>Valores</span></h1>
            </div>
            <nav><a href="inicio.html">Início</a></nav>
        </header>

       <main class="main-content">
    <div class="game-box">
        <h2 id="nivel-titulo">Nível 1</h2>
        <p class="subtitle">Encontre os pares de valores iguais!</p>
        
        <div id="memory-grid" class="memory-grid"></div>

        <!-- Botão de Ação Principal -->
        <button id="btn-jogar" class="btn-play-action" onclick="iniciarJogo()">JOGAR</button>

        <!-- NOVO: Modal de Mensagem Interna -->
        <div id="modal-vitoria" class="modal-vitoria" style="display: none;">
            <h3 id="modal-msg">Mandou bem!</h3>
            <button id="btn-proximo" class="btn-play-action" onclick="avançarNivel()">PRÓXIMO NÍVEL</button>
        </div>
    </div>
</main>

        <footer class="footer-controls">
            <button class="help-btn">🤟 Como Jogar?</button>
        </footer>
    </div>

    <script src="jogo2.js"></script>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
