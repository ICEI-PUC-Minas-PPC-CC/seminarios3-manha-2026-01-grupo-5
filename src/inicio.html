<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos dos Valores</title>
    <link rel="stylesheet" href="inicio.css">
</head>
<body>

    <div class="container">
        <header class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Logo do site" class="logo-img">
                <h1>Jogos dos <span>Valores</span></h1>
            </div>
            <nav>
                <a href="inicio.html">Início</a> | 
                <a href="contato.html">Contato</a>
            </nav>
        </header>

        <main class="main-content">
            <h2>Escolha um Jogo</h2>
            <p class="subtitle">Divirta-se aprendendo valores importantes!</p>
            
            <div class="games-selection">
                <a href="jogo1.html" class="game-link">
                    <div class="game-card">
                        <div class="game-icon-container">
                            <img src="combinacoes.png" alt="Combinação" class="game-icon-img">
                        </div>
                        <h3>Combine a Palavra</h3>
                        <p>Junte as palavras com as imagens</p>
                        <button class="btn-play-small">Jogar</button>
                    </div>
                </a>

                <a href="jogo2.html" class="game-link">
                    <div class="game-card">
                        <div class="game-icon-container">
                            <img src="memoria.png" alt="Jogo da Memória" class="game-icon-img">
                        </div>
                        <h3>Ache o Semelhante</h3>
                        <p>Encontre as cartas iguais</p>
                        <button class="btn-play-small">Jogar</button>
                    </div>
                </a>
            </div>
        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
